name: Build Alaa_TikTok
on:
  push:
    branches: [main, tiktok-glass]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: theos/theos
          path: theos
          submodules: recursive
      - name: Tools
        run: brew install ldid make dpkg
      - name: Build
        env:
          THEOS: ${{ github.workspace }}/theos
        run: |
          gmake package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          mkdir -p out
          cp packages/*.deb out/
          cp .theos/obj/Alaa_TikTok.dylib out/ || find .theos -name 'Alaa_TikTok.dylib' -exec cp {} out/ \;
          ls -la out
      - name: Media pipeline smoke tests
        run: |
          clang -fobjc-arc -Wno-deprecated-declarations -framework Foundation -framework AVFoundation -framework CoreVideo -framework CoreMedia tests/media_smoke.m -o /tmp/alaa-media-test
          /tmp/alaa-media-test
      - uses: actions/upload-artifact@v4
        with:
          name: Alaa_TikTok
          path: out/
      - name: Publish build to builds branch
        run: |
          cd out
          git init -q -b builds
          git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "build ${{ github.sha }}"
          git push -f https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git builds
